name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to commit SHAs (tag in the trailing comment).

jobs:
  python:
    name: python (ruff, pytest)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: findaro
          POSTGRES_PASSWORD: findaro
          POSTGRES_DB: findaro
        ports: ["54329:5432"]
        options: >-
          --health-cmd "pg_isready -U findaro" --health-interval 3s --health-timeout 3s --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ["63799:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 3s --health-timeout 3s --health-retries 30
    env:
      # Same ports as docker-compose.yml; tests/conftest.py reads these (and uses the hash embedder,
      # Redis DB 15 and its own index prefix, so no model download and no real LLM calls).
      FINDARO_TEST_DATABASE_URL: postgresql+asyncpg://findaro:findaro@localhost:54329/findaro_test
      FINDARO_TEST_OPENSEARCH_URL: http://localhost:19200
      FINDARO_TEST_REDIS_URL: redis://localhost:63799/15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # OpenSearch needs the analysis-icu plugin, so it can't be a plain service container: build the
      # repo's image (docker/opensearch) and run it.
      - name: Start OpenSearch (with analysis-icu)
        run: |
          docker build -t findaro-opensearch:ci docker/opensearch
          docker run -d --name opensearch -p 19200:9200 \
            -e discovery.type=single-node \
            -e DISABLE_SECURITY_PLUGIN=true \
            -e DISABLE_INSTALL_DEMO_CONFIG=true \
            -e OPENSEARCH_JAVA_OPTS="-Xms1g -Xmx1g" \
            -e cluster.routing.allocation.disk.threshold_enabled=false \
            findaro-opensearch:ci
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
      - name: Ruff
        run: uv run ruff check .
      - name: OpenAPI spec is up to date
        run: |
          uv run python scripts/export_openapi.py
          git diff --exit-code packages/sdk/openapi.json
      - name: Wait for OpenSearch
        run: |
          for i in $(seq 1 60); do
            curl -fs "http://localhost:19200/_cluster/health?wait_for_status=yellow&timeout=2s" && exit 0
            sleep 3
          done
          docker logs opensearch | tail -50
          exit 1
      - name: Pytest
        run: uv run pytest -q

  js:
    name: js (types, build, size budgets)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # gen:types (from the committed openapi.json), typecheck, build, bundle-size budgets
      - run: npm run check
      - name: Generated SDK types are up to date
        run: git diff --exit-code packages/sdk/src/api.gen.ts

  e2e:
    name: e2e (Playwright, full stack)
    needs: [python, js]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # Non-blocking for now: this job builds the full stack (including the embedding model) and runs the
    # widget and React example against it without an LLM (chat answers use the plain templates). It has
    # not been confirmed green in CI yet; make it blocking once it is.
    continue-on-error: true
    env:
      FINDARO_CHAT_PROVIDER: none
      FINDARO_PLANNER_PROVIDER: none
      FINDARO_QUERY_LOG: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Free disk space
        # The API image (torch + model) and OpenSearch fill the runner; OpenSearch blocks index creation
        # when the disk passes its watermarks.
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          enable-cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Start the stack
        run: |
          docker compose up -d --build --wait
          curl -fs -X PUT localhost:19200/_cluster/settings -H 'content-type: application/json' \
            -d '{"persistent": {"cluster.routing.allocation.disk.threshold_enabled": false}}'
      - run: uv sync --frozen
      - run: npm ci && npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - name: Stack logs on failure
        if: failure()
        run: docker compose logs --tail 200 api worker opensearch
