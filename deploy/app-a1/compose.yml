# zerch on a shared single-box host behind a shared Caddy (see deploy/app-a1/README.md).
# Only zerch-api and zerch-site join the shared `web` network; data services sit on a private network
# with no internet egress. Secrets come from .env next to this file (written by deploy.sh, chmod 600).
name: zerch

x-hardened: &hardened
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}

x-app: &app
  <<: *hardened
  image: zerch:${ZERCH_VERSION:-latest}
  user: "10001:10001"
  read_only: true
  tmpfs: ["/tmp:size=64m"]
  cap_drop: [ALL]
  env_file: .env
  environment: &app-env
    ZERCH_DATABASE_URL: postgresql+asyncpg://zerch:${POSTGRES_PASSWORD:?}@postgres:5432/zerch
    ZERCH_OPENSEARCH_URL: http://opensearch:9200
    ZERCH_REDIS_URL: redis://redis:6379/0
    ZERCH_ALLOW_LOCALHOST_ORIGINS: "false"
    ZERCH_QUERY_LOG: ""
    OMP_NUM_THREADS: "1"
    MKL_NUM_THREADS: "1"
    HOME: /tmp

services:
  api:
    <<: *app
    build: ./app
    container_name: zerch-api
    command: ["uvicorn", "zerch.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
    expose: ["8000"]
    networks: [web, internal]
    mem_limit: 1280m
    cpus: 1.5
    depends_on:
      postgres: {condition: service_healthy}
      opensearch: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 30

  worker:
    <<: *app
    command: ["python", "-m", "zerch.worker"]
    environment:
      <<: *app-env
      ZERCH_EMBEDDING_BATCH_SIZE: "16"  # smaller activation peak; 64 OOMs under the worker's memory limit
    networks: [internal]
    mem_limit: 1280m
    cpus: 1.0
    depends_on:
      api: {condition: service_healthy}

  postgres:
    <<: *hardened
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: zerch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: zerch
    volumes: [pgdata:/var/lib/postgresql/data]
    networks: [internal]
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zerch"]
      interval: 5s
      timeout: 3s
      retries: 30

  opensearch:
    <<: *hardened
    build: ./app/docker/opensearch
    image: zerch-opensearch:3.5.0
    environment:
      discovery.type: single-node
      # Security plugin off: the cluster is only reachable on the private `internal` network.
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: -Xms1g -Xmx1g
      bootstrap.memory_lock: "true"
      path.repo: /snapshots
    ulimits:
      memlock: {soft: -1, hard: -1}
      nofile: {soft: 65536, hard: 65536}
    volumes: [osdata:/usr/share/opensearch/data, ./backups/opensearch:/snapshots]
    networks: [internal]
    mem_limit: 2g
    cpus: 1.5
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=2s || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 60

  redis:
    <<: *hardened
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "96mb", "--maxmemory-policy", "allkeys-lru"]
    networks: [internal]
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  # Website (landing, pricing, docs) + POST /api/request-access. Same image, engine not loaded.
  site:
    <<: *hardened
    image: zerch:${ZERCH_VERSION:-latest}
    container_name: zerch-site
    user: "10001:10001"
    read_only: true
    tmpfs: ["/tmp:size=16m"]
    cap_drop: [ALL]
    command: ["uvicorn", "app:app", "--app-dir", "/site/server", "--host", "0.0.0.0", "--port", "8080",
              "--proxy-headers", "--forwarded-allow-ips", "*"]
    environment:
      SITE_DATABASE_URL: postgresql://zerch:${POSTGRES_PASSWORD:?}@postgres:5432/zerch
      SITE_REDIS_URL: redis://redis:6379/1
      SITE_PUBLIC_DIR: /site/public
      SITE_NOTIFY_WEBHOOK: ${SITE_NOTIFY_WEBHOOK:-}
      HOME: /tmp
    volumes: ["./site:/site:ro"]
    expose: ["8080"]
    networks: [web, internal]
    mem_limit: 160m
    cpus: 0.5
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

volumes:
  pgdata:
  osdata:

networks:
  web: {external: true}
  internal: {internal: true}
