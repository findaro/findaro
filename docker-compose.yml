name: findaro

x-app-env: &app-env
  FINDARO_DATABASE_URL: postgresql+asyncpg://findaro:findaro@postgres:5432/findaro
  FINDARO_OPENSEARCH_URL: http://opensearch:9200
  FINDARO_REDIS_URL: redis://redis:6379/0
  FINDARO_BOOTSTRAP_TOKEN: ${FINDARO_BOOTSTRAP_TOKEN:-}
  FINDARO_RATE_LIMIT_PER_SECOND: ${FINDARO_RATE_LIMIT_PER_SECOND:-50}
  FINDARO_OLLAMA_URL: ${FINDARO_OLLAMA_URL:-http://host.docker.internal:11434}
  FINDARO_ANTHROPIC_API_KEY: ${FINDARO_ANTHROPIC_API_KEY:-}
  # Query planner LLM (M2). Set FINDARO_PLANNER_PROVIDER=anthropic (+ key) to use Claude Haiku instead.
  FINDARO_PLANNER_PROVIDER: ${FINDARO_PLANNER_PROVIDER:-ollama}
  FINDARO_PLANNER_MODEL: ${FINDARO_PLANNER_MODEL:-llama3.2:3b}
  # Chat (M3/M4): answers and unclear-turn classification. Local Ollama by default (free).
  # For OpenAI set FINDARO_CHAT_PROVIDER=openai, FINDARO_CHAT_MODEL=gpt-4.1-mini and OPENAI_API_KEY (paid; cap it).
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  FINDARO_CHAT_PROVIDER: ${FINDARO_CHAT_PROVIDER:-ollama}
  FINDARO_CHAT_MODEL: ${FINDARO_CHAT_MODEL:-llama3.1:8b}
  # Query log for development: every search / chat turn as a JSON line in ./logs/queries.jsonl.
  # Set FINDARO_QUERY_LOG= (empty) to turn it off. Read it with: uv run python scripts/queries.py
  FINDARO_QUERY_LOG: ${FINDARO_QUERY_LOG-/logs/queries.jsonl}

services:
  api:
    extra_hosts: ["host.docker.internal:host-gateway"]  # reach Ollama on the host (needed on Linux)
    build: .
    image: findaro:dev
    environment: *app-env
    ports: ["8000:8000"]
    volumes: ["./logs:/logs"]
    depends_on:
      postgres: {condition: service_healthy}
      opensearch: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 30

  worker:
    extra_hosts: ["host.docker.internal:host-gateway"]  # reach Ollama on the host (needed on Linux)
    image: findaro:dev
    command: ["python", "-m", "findaro.worker"]
    environment: *app-env
    depends_on:
      api: {condition: service_healthy}

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: findaro
      POSTGRES_PASSWORD: findaro
      POSTGRES_DB: findaro
    ports: ["54329:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U findaro"]
      interval: 3s
      timeout: 3s
      retries: 30

  opensearch:
    build: docker/opensearch
    image: findaro-opensearch:3.5.0
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: -Xms1g -Xmx1g
      bootstrap.memory_lock: "true"
    ulimits:
      memlock: {soft: -1, hard: -1}
      nofile: {soft: 65536, hard: 65536}
    ports: ["19200:9200"]
    volumes: [osdata:/usr/share/opensearch/data]
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=2s || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 60

  redis:
    image: redis:7-alpine
    ports: ["63799:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30

  # Static demo page for the widget (examples/plain-html), on http://localhost:8080
  demo:
    image: nginx:1.27-alpine
    ports: ["8080:80"]
    volumes:
      - ./examples/plain-html:/usr/share/nginx/html:ro

volumes:
  pgdata:
  osdata:
