<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>findaro AI Mode demo</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body { font-family: system-ui, sans-serif; background: #fff; color: #18181b; }
    /* AI Mode fills whatever height you give it; here, the whole window */
    findaro-search { height: 100vh; height: 100dvh; }
    @media (prefers-color-scheme: dark) { body { background: #111113; color: #ececef; } }
  </style>
  <!-- One script tag + one element. Replace the two placeholders with your project's id and *search* key
       (python scripts/demo_setup.py writes ai-demo.html with real values). -->
  <script src="./findaro-widget.js" data-project="YOUR_PROJECT_ID" data-key="YOUR_SEARCH_KEY"
          data-base-url="http://localhost:8000" defer></script>
  <script>
    // Local demo convenience: this template still has placeholder keys; scripts/demo_setup.py writes ai-demo.html
    // with real ones. If that exists, go there. (The key name is split so demo_setup's replace leaves it alone.)
    if (document.querySelector('script[data-key="YOUR_' + 'SEARCH_KEY"]')) {
      fetch("ai-demo.html", { method: "HEAD" }).then((r) => { if (r.ok) location.replace("ai-demo.html"); });
    }
  </script>
</head>
<body>
  <findaro-search mode="ai" layout="page" badges="material,tags"
                  starters="black shoes under 1000|kurta for a wedding|steel water bottle|gift for a 10 year old">
  </findaro-search>
</body>
</html>
