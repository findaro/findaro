<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>findaro demo store</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #fff; color: #18181b; }
    main { max-width: 1040px; margin: 0 auto; padding: 32px 16px 64px; }
    h1 { font-size: 20px; margin: 0 0 4px; }
    p { margin: 0 0 20px; color: #71717a; font-size: 14px; }
    @media (prefers-color-scheme: dark) { body { background: #111113; color: #ececef; } }
  </style>
  <!-- The whole integration: one script tag + one element. Replace the two placeholders with your project's
       id and *search* key (python scripts/demo_setup.py writes demo.html with real values). -->
  <script src="./findaro-widget.js" data-project="YOUR_PROJECT_ID" data-key="YOUR_SEARCH_KEY"
          data-base-url="http://localhost:8000" defer></script>
  <script>
    // Local demo convenience: this template still has placeholder keys; scripts/demo_setup.py writes demo.html
    // with real ones. If that exists, go there. (The key name is split so demo_setup's replace leaves it alone.)
    if (document.querySelector('script[data-key="YOUR_' + 'SEARCH_KEY"]')) {
      fetch("demo.html", { method: "HEAD" }).then((r) => { if (r.ok) location.replace("demo.html"); });
    }
  </script>
</head>
<body>
  <main>
    <h1>Demo store</h1>
    <p>Search-only mode: try “kaale joote 1000 ke andar”, or switch to Ask AI and type “saree under 1000”.</p>
    <findaro-search mode="search"></findaro-search>
  </main>
</body>
</html>
