# Romanised Hindi (Hinglish) shopping vocabulary -> English. A language resource, not a vertical:
# everyday words people type when shopping, the way they type them (several spellings each).

name: hi-en

function_words: [
  ke, ka, ki, ko, se, mein, me, mai, main, mei, par, pe, liye, lie, liya, waste, vaste, wala, wali, wale,
  vala, vali, vale, walla, hai, hain, ho, hona, hoga, hogi, tha, thi, chahiye, chaiye, chahie, chaahiye,
  aur, ya, bhi, koi, kuch, kuchh, ek, do, jo, jisme, jiske, jaisa, jaise, wo, woh, yeh, ye, mujhe, muje,
  mera, meri, mere, apna, apni, apne, hum, humko, dikhao, dikha, dikhaiye, batao, bataiye, chahta, chahti,
  sakta, sakti, karne, karna, karo, kare, karta, karti, wastey, achha, acha, accha, badhiya, badiya,
  bahut, bohot, zyada, jyada, thoda, thodi, ekdum, ekdam, sabse, best, wala, pls, plz
]

price:
  currency: [rupay, rupaye, rupaiye, rupye, rupaye, rupiya, rupiye]
  # "500 <phrase>" -> price <= 500
  max_after: ["se kam", "se kum", "ke andar", "ke andr", "ke niche", "ke neeche", "se niche", "se neeche",
              "tak", "rs tak", "rupaye tak", "tak ka", "tak ki", "tak ke", "ke under", "ke bheetar", "ke bhitar",
              "se sasta", "se saste", "se sasti", "ke budget", "budget mein", "mein"]
  # "<phrase> 500" -> price <= 500
  max_before: ["andar", "budget", "zyada se zyada", "maximum"]
  # "500 <phrase>" -> price >= 500
  min_after: ["se zyada", "se jyada", "se upar", "se oopar", "ke upar", "ke oopar", "se mehenga", "se mehnga"]
  # "500 se 1000", "500 se 1000 tak"
  range_join: [se]

cheap: [sasta, sasti, saste, sastaa, "kam daam", "kam dam", "kam keemat", "kam kimat", "kam price",
        "kam paise", "kifayati", "kifaayati", "sasta wala", "sasti wali"]
expensive: [mehenga, mehnga, mehengi, mehngi, mehenge, mehnge, "mehnga wala", "branded", "acchi quality",
            "badhiya quality"]

