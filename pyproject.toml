[project]
name = "findaro"
version = "0.1.0"
description = "Open-source AI search as a service: hybrid retrieval, schema inference, Hinglish-friendly."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "The findaro authors" }]
keywords = ["search", "semantic-search", "hybrid-search", "opensearch", "ecommerce-search", "hinglish", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Natural Language :: Hindi",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "opensearch-py[async]>=2.6",
    "redis>=5.0",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "orjson>=3.10",
    "sentence-transformers>=3.0",
    "torch>=2.3",
    "pyyaml>=6.0.3",
]

[project.urls]
Homepage = "https://findaro.fortwinai.com"
Repository = "https://github.com/findaro/findaro"
Issues = "https://github.com/findaro/findaro/issues"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/findaro"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]  # FastAPI Depends()/File() defaults

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E501"]  # taxonomy/data tables
"eval/*" = ["E501"]
